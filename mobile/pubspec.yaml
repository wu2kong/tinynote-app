name: tinynote_mobile
description: TinyNote 轻记 iOS / Android 客户端，与桌面端共用 Markdown 存储格式。
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.10
  git2dart: ^0.5.4
  flutter_markdown_plus: ^1.0.12
  flutter_slidable: ^4.0.3
  lucide_icons_flutter: ^3.1.15
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2D9CDB"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sample_library.json
