name: Microsoft Store MSIX package

on:
  workflow_dispatch:
  push:
    branches: ['codex/microsoft-store']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/build-microsoft-store.ps1'
      - '.github/workflows/microsoft-store.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Build MSIX for Microsoft Store
        shell: pwsh
        run: ./scripts/build-microsoft-store.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix-${{ github.run_number }}
          path: dist-packages/microsoft-store/
          if-no-files-found: error
          retention-days: 14
