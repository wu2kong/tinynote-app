name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download Sparkle
        if: matrix.platform == 'macos-latest'
        run: bash scripts/download-sparkle.sh

      - name: Download WinSparkle
        if: matrix.platform == 'windows-latest'
        run: bash scripts/download-winsparkle.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.name }}
          releaseBody: ${{ github.event.release.body }}
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease }}
          args: ${{ matrix.args }}

  appcast:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Sparkle tools
        run: bash scripts/download-sparkle.sh

      - name: Publish Sparkle/WinSparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret. Add the EdDSA private key to GitHub Actions secrets."
            exit 1
          fi
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --pattern "*.dmg" || true
          gh release download "$TAG" --dir release-assets --pattern "*x64-setup.exe" || true
          shopt -s nullglob
          files=(release-assets/*.dmg release-assets/*x64-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS DMG or Windows NSIS installer found on the release."
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          printf '%s\n' "$RELEASE_BODY" > "$NOTES_FILE"
          node scripts/generate-sparkle-appcast.mjs \
            --tag "$TAG" \
            --notes-file "$NOTES_FILE" \
            --out appcast.xml \
            "${files[@]}"
          gh release upload "$TAG" appcast.xml --clobber

      - name: Mirror installers to Qiniu
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_CDN_BASE: ${{ secrets.QINIU_CDN_BASE }}
          QINIU_UPLOAD_HOST: ${{ secrets.QINIU_UPLOAD_HOST }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          if [ -z "$QINIU_ACCESS_KEY" ] || [ -z "$QINIU_SECRET_KEY" ] || [ -z "$QINIU_BUCKET" ] || [ -z "$QINIU_CDN_BASE" ]; then
            echo "Qiniu secrets not configured; skip China mirror."
            exit 0
          fi
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets || true
          shopt -s nullglob
          files=(release-assets/*.dmg release-assets/*x64-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS DMG or Windows NSIS installer found for the Qiniu mirror."
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes-qiniu.txt"
          printf '%s\n' "$RELEASE_BODY" > "$NOTES_FILE"
          node scripts/generate-sparkle-appcast.mjs \
            --tag "$TAG" \
            --notes-file "$NOTES_FILE" \
            --asset-base-url "$QINIU_CDN_BASE" \
            --out appcast-cn.xml \
            --latest-json latest.json \
            --latest-files-dir release-assets \
            --published-at "$PUBLISHED_AT" \
            "${files[@]}"
          node scripts/upload-qiniu.mjs \
            --dir release-assets \
            --appcast appcast-cn.xml \
            --latest latest.json